services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: faculty_analyzer
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ../database/seed_data.sql:/docker-entrypoint-initdb.d/2_seed_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20

  ml-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ml
    restart: unless-stopped
    ports:
      - "${ML_HOST_PORT:-8001}:8000"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started
    ports:
      - "${BACKEND_HOST_PORT:-5001}:5000"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:${BACKEND_HOST_PORT:-5001}/api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3000"

volumes:
  mysql_data:
